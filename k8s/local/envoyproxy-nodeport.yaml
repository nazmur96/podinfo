# Fixed NodePorts matching kind/cluster.yaml extraPortMappings
# (host 80→30080, host 443→30443). Do NOT add an IPv6 listenAddress on the
# kind mappings — see the comment there.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: nodeport
  namespace: gateway
  labels:
    app.kubernetes.io/name: envoy
    app.kubernetes.io/instance: podinfo-local
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: podinfo
    app.kubernetes.io/managed-by: kubectl
    team: nazmur96
spec:
  provider:
    type: Kubernetes
    kubernetes:
      # P3-8: two Envoy pods on different nodes, and a drain may take only
      # one at a time. With the default single replica, draining its node
      # took the front door down: 14-20 timed-out requests per drain while
      # podinfo itself stayed up.
      envoyDeployment:
        replicas: 2
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: public
                  gateway.envoyproxy.io/owning-gateway-namespace: gateway
      envoyPDB:
        maxUnavailable: 1
      envoyService:
        type: NodePort
        # Cluster (not Local): kind maps host 80/443 only onto the first
        # control-plane, while the Envoy pod lands on a worker. Local would
        # drop that traffic (TCP accept, TLS hang). Cluster kube-proxies it.
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: 80
                  protocol: TCP
                  targetPort: 10080
                  nodePort: 30080
                - name: https-443
                  port: 443
                  protocol: TCP
                  targetPort: 10443
                  nodePort: 30443
