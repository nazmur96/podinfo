# Fixed NodePorts matching kind/cluster.yaml extraPortMappings
# (host 80→30080, host 443→30443). Do NOT add an IPv6 listenAddress on the
# kind mappings — see the comment there.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: nodeport
  namespace: gateway
  labels:
    app.kubernetes.io/name: envoy
    app.kubernetes.io/instance: podinfo-local
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: podinfo
    app.kubernetes.io/managed-by: kubectl
    team: nazmur96
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        # Cluster (not Local): kind maps host 80/443 only onto the first
        # control-plane, while the Envoy pod lands on a worker. Local would
        # drop that traffic (TCP accept, TLS hang). Cluster kube-proxies it.
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - name: http-80
                  port: 80
                  protocol: TCP
                  targetPort: 10080
                  nodePort: 30080
                - name: https-443
                  port: 443
                  protocol: TCP
                  targetPort: 10443
                  nodePort: 30443
