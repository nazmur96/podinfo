# HTTP → HTTPS redirect. Lives in the gateway namespace because the http
# listener only allows Same-namespace routes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: podinfo-local
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: podinfo
    app.kubernetes.io/managed-by: kubectl
    team: nazmur96
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: http
  hostnames:
    - podinfo.localhost
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
