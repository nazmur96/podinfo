# P3-10 Loki, single binary, demo-grade: 1 replica, filesystem storage on a
# local-path PVC, 24 h retention, no caches, no gateway, no canary.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 24h
    allow_structured_metadata: true # OTLP log attributes (trace_id, if any)
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  podSecurityContext:
    fsGroup: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile: { type: RuntimeDefault }
  containerSecurityContext:
    readOnlyRootFilesystem: true
    capabilities: { drop: ["ALL"] }
    allowPrivilegeEscalation: false
singleBinary:
  replicas: 1
  persistence:
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
sidecar:
  rules: { enabled: false }
