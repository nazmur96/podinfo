# P3-10 Grafana Alloy, one Deployment (not a DaemonSet): reads pod logs
# through the Kubernetes API (no hostPath, so PSA restricted holds) and
# relays OTLP from podinfo to Tempo (traces) and Loki (logs).
controller:
  type: deployment
  replicas: 1
  volumes:
    extra:
      - name: storage
        emptyDir: {}
global:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 473
    runAsGroup: 473
    fsGroup: 473
    seccompProfile: { type: RuntimeDefault }
alloy:
  storagePath: /tmp/alloy
  mounts:
    varlog: false
    dockercontainers: false
    extra:
      - name: storage
        mountPath: /tmp/alloy
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: ["ALL"] }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
  configMap:
    content: |
      // Logs: every container in podinfo-dev, read via the API server.
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces { names = ["podinfo-dev"] }
      }
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.json.receiver]
      }
      // podinfo logs JSON: lift the level, keep the line as is.
      loki.process "json" {
        stage.json {
          expressions = { level = "level" }
        }
        stage.labels {
          values = { level = "" }
        }
        forward_to = [loki.write.local.receiver]
      }

      // OTLP from podinfo: traces → Tempo, logs → Loki (label source=otlp).
      otelcol.receiver.otlp "default" {
        grpc { endpoint = "0.0.0.0:4317" }
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
          logs   = [otelcol.exporter.loki.local.input]
        }
      }
      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.observability.svc.cluster.local:4317"
          tls { insecure = true }
        }
      }
      otelcol.exporter.loki "local" {
        forward_to = [loki.process.otlp.receiver]
      }
      loki.process "otlp" {
        stage.static_labels {
          values = { source = "otlp" }
        }
        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
