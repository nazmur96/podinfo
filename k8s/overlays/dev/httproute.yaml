# CUJ allow-list only (P3-6 / P9-3). Exact matches — never PathPrefix: /,
# which would also route the step-8 paths (/env, /panic, …).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
  namespace: podinfo-dev
  labels:
    app.kubernetes.io/name: podinfo
    app.kubernetes.io/instance: podinfo-dev
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: podinfo
    app.kubernetes.io/managed-by: kubectl
    team: nazmur96
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https
  hostnames:
    - podinfo.localhost
  rules:
    - matches:
        - path: { type: Exact, value: / }
        - path: { type: Exact, value: /version }
        - path: { type: Exact, value: /healthz }
        - path: { type: Exact, value: /readyz }
        - path: { type: Exact, value: /token }
        - path: { type: Exact, value: /token/validate }
      backendRefs:
        - name: podinfo
          port: 80
