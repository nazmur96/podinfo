apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  # podinfo's route belongs with the app (its hostname and paths are podinfo's).
  # Needs the Gateway API CRDs: run scripts/install-local-platform.sh first.
  - httproute.yaml
  # P3-7: who may call podinfo depends on the front door, so the allow is local.
  - networkpolicy-gateway.yaml
images:
  # scripts/deploy.sh rewrites newTag to the full git SHA in a temp copy.
  - name: podinfo
    newName: podinfo
    newTag: tag-placeholder
