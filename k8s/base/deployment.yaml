apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: podinfo-dev
  labels:
    app.kubernetes.io/name: podinfo
    app.kubernetes.io/instance: podinfo-dev
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: podinfo
    app.kubernetes.io/managed-by: kubectl
    team: nazmur96
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      # Immutable: name + instance only (phase-3-plan P3-2).
      app.kubernetes.io/name: podinfo
      app.kubernetes.io/instance: podinfo-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podinfo
        app.kubernetes.io/instance: podinfo-dev
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: podinfo
        app.kubernetes.io/managed-by: kubectl
        team: nazmur96
    spec:
      serviceAccountName: podinfo
      automountServiceAccountToken: false
      # Shutdown budget (P3-8, measured through the Gateway): preStop 5 s +
      # podinfo's 3 s drain sleep + up to 5 s --server-shutdown-timeout =
      # 13 s worst case, well inside this. scripts/rollout-drill.sh: preStop
      # 5 s → 0 non-200 in 8 restarts; no preStop → 4 then 0; no preStop +
      # --level=debug (skips the 3 s sleep) → 7-8 per restart.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: podinfo
              app.kubernetes.io/instance: podinfo-dev
      containers:
        - name: podinfo
          # Tag replaced by scripts/deploy.sh (podinfo:<full-sha>). Never latest.
          image: podinfo:tag-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9898
              protocol: TCP
          # Env only — never args:. args: replaces the image CMD and drops
          # --ui-path / --data-path (P2-4 /data trap).
          env:
            - name: PODINFO_CONFIG_PATH
              value: /config
            - name: GOMEMLIMIT
              value: "115MiB" # ~90% of the 128Mi memory limit (sizing-and-cost.md)
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 128Mi
              # No CPU limit: throttling (sizing-and-cost.md).
          # No startupProbe: podinfo is Ready in ~100 ms (inventory.md).
          # Java startupProbe drill is n/a → Retail Store.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Native sleep (K8s ≥ 1.30): distroless has no shell for `sleep`.
              # Gives Envoy time to drop the endpoint before podinfo stops
              # answering (P3-8). Recheck behind the ALB (questions.md #3).
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Directory mount of the whole Secret (D5). No subPath: a subPath
            # file never sees Secret updates.
            - name: config
              mountPath: /config
              readOnly: true
          # No /tmp emptyDir: P2-4 proved CUJ paths write nothing with /store off.
      volumes:
        - name: config
          secret:
            secretName: podinfo-config
