# P3-1: local multi-node cluster. Same Kubernetes minor as kubectl and EKS
# (ADR-0010). Port mappings use fixed NodePorts so P3-6's Gateway Service can
# bind them; mapping host 80→container 80 only works if something listens on
# 80 *on the node* (it won't).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: podinfo
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    # Host 80/443 → NodePorts the Gateway Service will use (P3-6). Docker
    # publishes these on IPv4 only (0.0.0.0). That's enough: podinfo.localhost
    # resolves to ::1 AND 127.0.0.1; ::1 is refused at once, so curl falls back
    # to 127.0.0.1 (tested: 200 via 127.0.0.1). Do NOT add a listenAddress "::"
    # mapping: Docker forwards it to the node's IPv6 address, which this
    # IPv4-only cluster doesn't serve, so the connection is accepted and then
    # dies, and curl never falls back (tested: 000).
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  - role: worker
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
